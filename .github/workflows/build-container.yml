name: Build Container

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ github.sha }}