name: Deploy Test

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      version_var:
        required: true
        type: string
      container_name:
        required: true
        type: string
      internal_port:
        required: true
        type: number
      health_path:
        required: false
        type: string
        default: /health/ready
      public_url:
        required: true
        type: string

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux

    environment:
      name: test
      url: ${{ inputs.public_url }}

    concurrency:
      group: ${{ inputs.app_name }}-test
      cancel-in-progress: false

    steps:
      - name: Deploy application
        shell: bash
        run: |
          /opt/pencilcaselamp/scripts/deploy-app \
            test \
            "${{ inputs.app_name }}" \
            "${{ inputs.version_var }}" \
            "${{ github.sha }}" \
            "${{ inputs.container_name }}" \
            "${{ inputs.internal_port }}" \
            "${{ inputs.health_path }}"

  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: External readiness check
        run: |
          curl --fail \
            "${{ inputs.public_url }}${{ inputs.health_path }}"

      - name: Verify deployed SHA
        run: |
          response=$(curl --fail \
            "${{ inputs.public_url }}/api/version")

          echo "$response"
          echo "$response" | grep "${{ github.sha }}"