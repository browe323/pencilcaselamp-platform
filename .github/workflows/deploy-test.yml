name: Deploy Test

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

      public_url:
        required: true
        type: string

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux

    environment:
      name: test
      url: ${{ inputs.public_url }}

    concurrency:
      group: ${{ inputs.app_name }}-test
      cancel-in-progress: false

    steps:
      - name: Deploy application
        shell: bash
        run: |
          /opt/pencilcaselamp/scripts/deploy-app \
            test \
            "${{ inputs.app_name }}" \
            "${{ github.sha }}"

  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify readiness
        run: |
          curl --fail \
            "${{ inputs.public_url }}/health/ready"

      - name: Verify deployed SHA
        run: |
          response=$(curl --fail \
            "${{ inputs.public_url }}/api/version")

          echo "$response"
          echo "$response" | grep "${{ github.sha }}"